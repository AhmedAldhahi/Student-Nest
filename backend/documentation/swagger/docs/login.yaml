openapi: 3.0.0
info:
  title: Authentication API
  version: 1.0.0
  description: API for user login

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://api.student-nest.com/api/v1
    description: Production server

paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticate a user using email and password and return an access token.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: myStrongPassword123
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: User login successful
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Bad request or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                example:
                  err: The password or email is not correct
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                example:
                  err: Internal server error

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
      required:
        - message
        - token
