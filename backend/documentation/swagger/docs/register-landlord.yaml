openapi: 3.0.0
info:
  title: Student Nest API
  version: 1.0.0
  description: API documentation for Student Nest backend.

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://api.student-nest.com/api/v1
    description: Production server

paths:
  /auth/register/landlord:
    post:
      summary: Register a new landlord
      description: Endpoint to register a landlord user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLandlordRequest'
            example:
              email: landlord@example.com
              name: John Doe
              password: StrongPassword123
              role: landloard
              dateOfBirth: "1985-05-20"
              phoneNumber: "+962798765432"
              cliQAccount: "CLIQ12345"
              LandloardGovId: "GOV12345"
              address: "Amman, Jordan"
      responses:
        '201':
          description: Landlord registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterLandlordResponse'
              example:
                message: Landlord registered successfully
                userId: 101
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid email or missing required fields
        '409':
          description: Conflict (email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email already registered
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Server error, please try again later

components:
  schemas:
    RegisterLandlordRequest:
      type: object
      required:
        - email
        - name
        - password
        - role
        - dateOfBirth
        - phoneNumber
        - cliQAccount
        - LandloardGovId
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, landloard]
        dateOfBirth:
          type: string
          format: date
        phoneNumber:
          type: string
        cliQAccount:
          type: string
        LandloardGovId:
          type: string
        address:
          type: string
          nullable: true   # optional now

    RegisterLandlordResponse:
      type: object
      required:
        - message
        - userId
      properties:
        message:
          type: string
        userId:
          type: number

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
