openapi: 3.0.0
info:
  title: Verification API
  version: 1.0.0
  description: API for resending OTPs for email verification

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.student-nest.com/api/v1
    description: Production server

paths:
  /verification/resend-otp:
    patch:
      summary: Resend OTP to user's email
      description: Sends a new OTP to the provided email address.
      tags:
        - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOtpResponse'
              example:
                message: OTP sent successfully
        '409':
          description: Conflict or failed resend attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: failed to resend otp!1
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: Invalid email
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: server Error

components:
  schemas:
    ResendOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResendOtpResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
