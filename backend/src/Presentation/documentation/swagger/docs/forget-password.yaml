openapi: 3.0.0
info:
  title: Student Nest API
  description: API documentation for the Student Nest backend system, including password recovery and password change functionality.
  version: 1.0.0
  contact:
    name: Backend Development Team
    email: backend-team@example.com
    url: https://example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://student-nest-production.up.railway.app/api/v1
    description: Production Server

paths:
  /password-recovery/forget-password:
    patch:
      summary: Update Password Endpoint
      description: This endpoint allows the user to reset their password by providing their email and new password.
      operationId: updatePassword
      tags:
        - Authentication
      requestBody:
        description: The email and new password required for updating the password.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "abdalrahmanalkayyali1948@gmail.com"
                  description: The email address of the user who is requesting the password change.
                password:
                  type: string
                  example: "hashPaswggwegwe132!"
                  description: The new password for the user’s account. It should meet the complexity requirements.
              required:
                - email
                - password
      responses:
        '200':
          description: Password successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User password has been updated successfully"
                    description: Success message indicating the password was updated.
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJmMWYyZGY2Yi0wMjZlLTQzZGItODkxMi0yOTM3YmYzMGMzYTgiLCJpYXQiOjE3NjM4Mzg0OTcsImV4cCI6MTc2MzgzOTM5N30.15Gd6pr6KQ8MfeTFnYJCBvhhs5Geowx9EiKeitGzrWc"
                    description: A new token generated after the password change, allowing the user to proceed.
        '400':
          description: No user found with the provided email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No user found!"
                    description: Error message indicating that no user was found with the provided email.
        '400':
          description: Password already used
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "This password has been used before"
                    description: Error message indicating the new password is not allowed because it has been used previously.
        '400':
          description: Invalid password format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indicates the failure of the password update attempt.
                  message:
                    type: string
                    example: "Validation failed"
                    description: Error message describing the validation failure.
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: "password"
                        message:
                          type: string
                          example: "Password must include uppercase, lowercase, number, and special character"
                          description: Specific error message for the invalid password.
        '429':
          description: Too many requests (rate limiting)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Too many login requests. Please wait a while before trying again."
                    description: Error message indicating the user has exceeded the allowed number of requests in a short period.
        '400':
          description: OTP verification required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "The user must verify OTP before updating password!"
                    description: Error message indicating that OTP verification is required before changing the password.

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid email address"
    ValidationError:
      type: object
      properties:
        path:
          type: string
          example: "password"
        message:
          type: string
          example: "Password must include uppercase, lowercase, number, and special character"
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "User password has been updated successfully"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJmMWYyZGY2Yi0wMjZlLTQzZGItODkxMi0yOTM3YmYzMGMzYTgiLCJpYXQiOjE3NjM4Mzg0OTcsImV4cCI6MTc2MzgzOTM5N30.15Gd6pr6KQ8MfeTFnYJCBvhhs5Geowx9EiKeitGzrWc"
