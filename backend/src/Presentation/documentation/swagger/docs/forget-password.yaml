openapi: 3.0.0
info:
  title: Password Recovery API
  version: 1.0.0
  description: API for handling user password recovery and change

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://api.student-nest.com/api/v1
    description: Production server

tags:
  - name: PasswordRecovery
    description: Endpoints for password recovery and change

paths:
  /recover-password/forget-password:
    patch:
      summary: Change user password (Forget Password)
      description: Updates a user's password after verifying it is not the same as the previous one.
      tags:
        - PasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
            example:
              email: user@example.com
              password: "NewStrongP@ssw0rd!"
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetPasswordResponse'
              example:
                message: "User password updated successfully"
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Bad request or validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "Password must include uppercase, lowercase, number, and special character"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "No user found with this email"
        '409':
          description: Password has been used before
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "Password has been used before"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "Failed to update password, please try again later"

components:
  schemas:
    ForgetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    ForgetPasswordResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
      required:
        - message
        - token
