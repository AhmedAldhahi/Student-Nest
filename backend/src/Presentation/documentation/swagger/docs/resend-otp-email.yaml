openapi: 3.0.0
info:
  title: Student Nest API
  description: API documentation for the Student Nest backend system, including authentication and password recovery endpoints.
  version: 1.0.0
  contact:
    name: Backend Development Team
    email: backend-team@example.com
    url: https://example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://student-nest-production.up.railway.app/api/v1
    description: Production Server

paths:
  /resend-otp:
    post:
      summary: Resend OTP for Verified Email
      description: This endpoint allows the user to resend the OTP to their verified email address.
      operationId: resendOtp
      tags:
        - Authentication
      requestBody:
        description: The email address required to resend the OTP to the user’s verified email.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "abdalrahmanalkayy8ali1948g@gmail.com"
                  description: The email address of the user who is requesting the OTP resend.
              required:
                - email
      responses:
        '200':
          description: OTP resent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP has been resent successfully. Check your email."
                    description: Success message indicating that the OTP has been resent to the email.
        '400':
          description: No user found with the provided email
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    example: "no user been found !!"
                    description: Error message indicating that no user was found with the provided email.
        '429':
          description: Too many requests (rate limiting)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Too many login requests. Please wait a while before trying again."
                    description: Error message informing the user to wait before trying again due to rate limits.
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "No user found!"
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "OTP has been resent successfully. Check your email."
