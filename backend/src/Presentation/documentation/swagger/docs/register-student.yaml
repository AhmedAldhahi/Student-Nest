openapi: 3.0.0
info:
  title: Student Nest API
  version: 1.0.0
  description: API documentation for Student Nest backend.

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://api.student-nest.com/api/v1
    description: Production server

paths:
  /auth/register/student:
    post:
      summary: Register a new student
      description: Endpoint to register a student user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
            encoding:
              verificationFile:
                contentType: application/octet-stream
      responses:
        '201':
          description: Student registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterStudentResponse'
              example:
                message: Student registered successfully! Verify your email with the OTP.
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Verification file is required
        '409':
          description: Conflict (email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email already registered
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Server error, please try again later

components:
  schemas:
    RegisterStudentRequest:
      type: object
      required:
        - email
        - name
        - password
        - role
        - dateOfBirth
        - phoneNumber
        - major
        - gradateYear
        - studentCardId
        - universityName
        - studentGovId
        - verificationFile
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [student]
        dateOfBirth:
          type: string
          format: date
        phoneNumber:
          type: string
        major:
          type: string
        gradateYear:
          type: string
          description: Graduation year in YYYY format
        studentCardId:
          type: string
        universityName:
          type: string
        studentGovId:
          type: string
        verificationFile:
          type: string
          format: binary
        address:
          type: string
          nullable: true

    RegisterStudentResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
