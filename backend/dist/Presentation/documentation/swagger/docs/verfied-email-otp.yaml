openapi: 3.0.0
info:
  title: Student Nest API
  description: API documentation for the Student Nest backend system, including OTP verification for email.
  version: 1.0.0
  contact:
    name: Backend Development Team
    email: backend-team@example.com
    url: https://example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://student-nest-production.up.railway.app/api/v1
    description: Production Server

paths:
  /verified-otp:
    post:
      summary: Verify OTP for Email
      description: This endpoint allows the user to verify the OTP code for the provided email.
      operationId: verifyOtp
      tags:
        - Authentication
      requestBody:
        description: The email and OTP code required to verify the OTP for the user.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "abdalrahmanalkayyali1948g@gmail.com"
                  description: The email address of the user who is verifying the OTP.
                otpCode:
                  type: string
                  example: "931322"
                  description: The OTP code that was sent to the user's email for verification.
              required:
                - email
                - otpCode
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP verified successfully, you can proceed to reset your password now."
                    description: Success message indicating that the OTP was successfully verified.
        '400':
          description: Invalid OTP code
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid OTP code."
                    description: Error message indicating that the OTP code provided is invalid.
        '400':
          description: User already verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User already verified."
                    description: Error message indicating that the user has already verified their email.
        '400':
          description: No user found with the provided email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No user found for this email."
                    description: Error message indicating that no user was found with the provided email.
        '429':
          description: Too many requests (rate limiting)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Too many login requests. Please wait a while before trying again."
                    description: Error message informing the user to wait before trying again due to rate limits.
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "OTP verified successfully, you can proceed to reset your password now."
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Invalid OTP code."
    RateLimitError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Too many login requests. Please wait a while before trying again."
