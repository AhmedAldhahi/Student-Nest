openapi: 3.0.0
info:
  title: Student Nest API
  description: API documentation for the Student Nest backend system. This includes authentication, password recovery, and registration endpoints.
  version: 1.0.0
  contact:
    name: Backend Development Team
    email: backend-team@example.com
    url: https://example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://student-nest-production.up.railway.app/api/v1
    description: Production Server

paths:
  /password-recovery/verified-otp:
    post:
      summary: Verify OTP for Password Recovery
      description: This endpoint verifies the OTP for password recovery sent to the user’s email.
      operationId: verifyOtp
      tags:
        - Authentication
      requestBody:
        description: The email and OTP code required for OTP verification.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "abdalrahmanalkayyali1948@gmail.com"
                  description: The email address of the user requesting OTP verification.
                otpCode:
                  type: string
                  example: "649621e"
                  description: The OTP code sent to the user's email for verification.
              required:
                - email
                - otpCode
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP verified successfully, update your password now"
                    description: Success message indicating OTP verification was successful and the user can now update their password.
        '400':
          description: Invalid OTP or email format
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    example: "Invalid OTP code."
                    description: Error message indicating the OTP code is invalid.
        '400':
          description: Validation Error - Invalid email format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Validation failed"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: "email"
                        message:
                          type: string
                          example: "Invalid email address"
        '429':
          description: Too many requests (rate limiting)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Too many login requests. Please wait a while before trying again."
                    description: Error message informing the user to wait before trying again due to rate limits.
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid OTP code."
    ValidationError:
      type: object
      properties:
        path:
          type: string
          example: "email"
        message:
          type: string
          example: "Invalid email address"
    SuccessResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            message:
              type: string
              example: "OTP verified successfully, update your password now"
